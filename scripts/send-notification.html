<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saathi AI - Broadcast Push Notifications</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-bg: #190019;
            --color-panel: #2B124C;
            --color-border: #522B5B;
            --color-primary: #854F6C;
            --color-secondary: #DFB6B2;
            --color-text: #FBE4D8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--color-panel);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--color-border);
        }

        h1 {
            color: var(--color-secondary);
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .section-title {
            color: var(--color-secondary);
            font-size: 1.2rem;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-secondary);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--color-border);
            background-color: rgba(25, 0, 25, 0.6);
            color: var(--color-text);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--color-secondary);
        }

        .btn {
            background-color: var(--color-primary);
            color: var(--color-text);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: var(--color-border);
        }

        .btn:disabled {
            background-color: #333;
            color: #888;
            cursor: not-allowed;
        }

        .logs {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 1rem;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            color: var(--color-secondary);
        }

        .log-success { color: #86efac; }
        .log-error { color: #fca5a5; }
        .log-info { color: var(--color-secondary); }
    </style>
</head>
<body>

<div class="container">
    <h1>Saathi AI - Notification Broadcast</h1>

    <div class="section-title">1. Notification Details</div>

    <div class="form-group">
        <label for="notifTitle">Title</label>
        <input type="text" id="notifTitle" placeholder="e.g. 🌱 Weather Alert" value="Saathi AI 🌱">
    </div>

    <div class="form-group">
        <label for="notifBody">Body</label>
        <textarea id="notifBody" rows="3" placeholder="Notification message..."></textarea>
    </div>

    <div class="form-group">
        <label for="notifImage">Image URL (Optional)</label>
        <input type="text" id="notifImage" placeholder="https://example.com/image.jpg">
        <p style="font-size: 0.75rem; color: var(--color-primary); margin-top: 5px; margin-bottom: 0;">
            Direct link to an image to display in the notification (if supported).
        </p>
    </div>

    <div class="form-group">
        <label for="notifType">Notification Type / Route</label>
        <select id="notifType">
            <option value="system">System Announcement</option>
            <option value="alert">Alert (High Priority)</option>
            <option value="insight">Insight</option>
        </select>
    </div>

    <button id="sendBtn" class="btn" onclick="sendBroadcast()">Fetch Tokens & Send Broadcast</button>

    <div class="section-title">Console Logs</div>
    <div id="logs" class="logs">Waiting to start...<br></div>
</div>

<script>
    // Hardcoded Database Credentials
    const SB_URL = 'https://gzqqjrwrgwutvxzbwzyl.supabase.co';
    const SB_KEY = 'sb_publishable_m_iy0GI5ZnEWeKOxAn1ZTg_1-4vyprV';

    const logsDiv = document.getElementById('logs');
    const sendBtn = document.getElementById('sendBtn');

    function log(message, type = 'info') {
        const span = document.createElement('span');
        span.className = `log-${type}`;
        const time = new Date().toLocaleTimeString();
        span.innerText = `[${time}] ${message}\n`;
        logsDiv.appendChild(span);
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function sendBroadcast() {
        const title = document.getElementById('notifTitle').value.trim();
        const body = document.getElementById('notifBody').value.trim();
        const type = document.getElementById('notifType').value;
        const image = document.getElementById('notifImage').value.trim();

        if (!title || !body) return alert("Please enter a Title and Body.");

        sendBtn.disabled = true;
        sendBtn.innerText = "Processing...";
        logsDiv.innerHTML = "";
        
        try {
            log("Connecting to Supabase...", "info");
            
            // Initialize Supabase client
            const supabase = window.supabase.createClient(SB_URL, SB_KEY);

            // Fetch tokens from DB
            log("Running query: SELECT expo_push_token FROM user_devices WHERE expo_push_token IS NOT NULL;", "info");
            const { data, error } = await supabase
                .from('user_devices')
                .select('expo_push_token')
                .not('expo_push_token', 'is', null);

            if (error) throw new Error(error.message);

            if (!data || data.length === 0) {
                log("No tokens found in database. Exiting.", "error");
                sendBtn.disabled = false;
                sendBtn.innerText = "Fetch Tokens & Send Broadcast";
                return;
            }

            // Extract unique valid Expo tokens
            const rawTokens = data.map(d => d.expo_push_token);
            const validTokens = [...new Set(rawTokens.filter(t => t && t.startsWith('ExponentPushToken[')))];

            log(`Extracted ${validTokens.length} valid unique Expo Push Tokens.`, "success");

            if (validTokens.length === 0) {
                log("No valid Expo tokens to send to.", "error");
                sendBtn.disabled = false;
                sendBtn.innerText = "Fetch Tokens & Send Broadcast";
                return;
            }

            // Build Messages
            const messages = validTokens.map(token => ({
                to: token,
                sound: 'default',
                title: title,
                body: body,
                priority: 'high',
                channelId: type === 'alert' ? 'alerts' : 'default',
                data: { type: type, image: image },
                ...(image ? { image: image } : {}) // Pass image natively for Expo Android
            }));

            log("Sending payload to Expo Push API...", "info");

            // Chunk messages to avoid limits (max 100 per chunk usually, keeping it 50 for safety)
            const CHUNK_SIZE = 50;
            let totalSuccess = 0;
            let totalFail = 0;

            for (let i = 0; i < messages.length; i += CHUNK_SIZE) {
                const chunk = messages.slice(i, i + CHUNK_SIZE);
                log(`Sending chunk ${Math.floor(i/CHUNK_SIZE) + 1}...`, "info");
                
                const response = await fetch('https://exp.host/--/api/v2/push/send', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Accept-encoding': 'gzip, deflate',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(chunk)
                });

                const result = await response.json();
                
                if (result.data) {
                    const successCount = result.data.filter(r => r.status === 'ok').length;
                    const errorCount = result.data.filter(r => r.status === 'error');
                    
                    totalSuccess += successCount;
                    totalFail += errorCount.length;

                    errorCount.forEach(err => log(`Expo Error: ${err.message}`, "error"));
                }
            }

            log(`--- BROADCAST COMPLETE ---`, "success");
            log(`Success: ${totalSuccess} devices received the push`, "success");
            if (totalFail > 0) log(`Failed: ${totalFail} devices failed`, "error");

        } catch (err) {
            log(`Error: ${err.message}`, "error");
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = "Fetch Tokens & Send Broadcast";
        }
    }
</script>
</body>
</html>
